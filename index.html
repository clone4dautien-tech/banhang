<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bán hàng &amp; Khách hàng</title>
<style>
:root{--bg:#F6F7F4;--card:#fff;--ink:#14201C;--mut:#5B6760;--line:#DDE2DC;--pri:#0F766E;--on:#fff;--soft:#E3F1EE;--softt:#0B5A53;--amb:#B45309;--ambbg:#FFF4E5;--ambl:#F3D9B1;--ambt:#8A4106;--red:#B42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1512;--card:#18201C;--ink:#EAF0EC;--mut:#A3B0A8;--line:#2B3630;--pri:#2DD4BF;--on:#06201C;--soft:#173A36;--softt:#8FE3D6;--amb:#FBBF77;--ambbg:#2E2210;--ambl:#4A3716;--ambt:#F5C98A;--red:#FDA29B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1512;--card:#18201C;--ink:#EAF0EC;--mut:#A3B0A8;--line:#2B3630;--pri:#2DD4BF;--on:#06201C;--soft:#173A36;--softt:#8FE3D6;--amb:#FBBF77;--ambbg:#2E2210;--ambl:#4A3716;--ambt:#F5C98A;--red:#FDA29B;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#main{max-width:480px;margin:0 auto;padding:20px 20px 96px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px}h2{margin:0;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;cursor:pointer}
.btn{background:var(--ink);color:var(--bg);border:none;font-weight:600;font-size:16px;min-height:52px;width:100%}
.pri{background:var(--pri);color:var(--on)}
.sm{min-height:44px;min-width:44px;padding:0 10px}
.danger{color:var(--red)}
.hero{background:var(--pri);color:var(--on);border-radius:20px;padding:18px 20px}
.hero b{font-size:32px;display:block;margin:4px 0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{flex-direction:column;gap:6px;min-height:80px;font-size:12px;font-weight:500;padding:8px 2px;display:flex;align-items:center;justify-content:center}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pg button{text-align:left;padding:10px 12px;min-height:56px}
.badge{background:var(--soft);color:var(--softt);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:600}
.promo{background:var(--ambbg);border:1px solid var(--ambl);color:var(--ambt);border-radius:16px;padding:12px 14px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.big{font-size:20px;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:4px 8px env(safe-area-inset-bottom,0px);z-index:5}
nav button{border:none;background:none;flex-direction:column;display:flex;align-items:center;gap:2px;font-size:11px;color:var(--mut);min-height:56px}
nav button.on{color:var(--pri);font-weight:700}
#alert{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:9;display:flex;flex-direction:column;gap:6px;padding:8px}
.al{background:var(--amb);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600;max-width:464px;margin:0 auto;width:100%}
.al button{background:none;border:1px solid currentColor;color:inherit;min-height:44px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
label{font-size:13px;color:var(--mut)}
.done{opacity:.5}
</style>
</head>
<body>
<div id="alert"></div>
<main id="main"></main>
<nav>
<button id="n-home" onclick="go('home')"></button>
<button id="n-sell" onclick="go('sell')"></button>
<button id="n-cal" onclick="go('cal')"></button>
<button id="n-cust" onclick="go('cust')"></button>
</nav>
<div id="toast" role="status"></div>
<script>
const K='shopapp.v1';
let S={products:[],customers:[],appts:[],promos:[],invoices:[],set:{rate:10,unit:1000}};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(n).toLocaleString('vi-VN')+' ₫';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const P={home:'M3 11 12 4l9 7v9H3z',sell:'M2 3h3l2.5 12h11L21 7H6',cal:'M3 8h18v13H3zM8 3v4M16 3v4',cust:'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8M4 21c0-4 4-6 8-6s8 2 8 6',box:'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',tag:'M20 12 12 20 4 12V4h8z',plus:'M12 5v14M5 12h14'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
let view='home',cart={},cust='',disc={t:'p',v:0},promoId='',pay='Tiền mặt';
const NAV={home:'Trang chủ',sell:'Bán hàng',cal:'Lịch',cust:'Khách'};
for(const k in NAV)$('#n-'+k).innerHTML=ic(k)+NAV[k];
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',1800)}
function go(v){view=v;render();scrollTo(0,0)}
function render(){
 $('#main').innerHTML=V[view]();
 for(const k in NAV)$('#n-'+k).className=(view==k||(k=='home'&&(view=='prod'||view=='promo')))?'on':'';
}
function set(a,id,k,v,num){const o=S[a].find(x=>x.id==id);if(o){o[k]=num?(+v||0):v;save()}}
function del(a,id){S[a]=S[a].filter(x=>x.id!=id);save();render()}
function setS(k,v){S.set[k]=+v||0;save()}
const okPromo=(p,sub)=>p.on&&sub>=p.min&&(!p.end||p.end>=today());
function calc(){
 let sub=0;for(const id in cart){const p=S.products.find(x=>x.id==id);if(p)sub+=p.price*cart[id]}
 const pr=S.promos.find(x=>x.id==promoId);let pd=0;
 if(pr&&okPromo(pr,sub))pd=pr.t=='p'?sub*pr.v/100:pr.v;
 const md=disc.t=='p'?(sub-pd)*disc.v/100:+disc.v;
 const total=Math.max(0,sub-pd-md);
 return{sub,pd,md,total,pts:Math.floor(total*S.set.rate/100/(S.set.unit||1))};
}
function add(id){cart[id]=(cart[id]||0)+1;render()}
function qty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render()}
function checkout(){
 const c=calc();if(!c.sub)return toast('Chưa chọn sản phẩm');
 const items=Object.keys(cart).map(id=>{const p=S.products.find(x=>x.id==id);return{n:p.name,p:p.price,q:cart[id]}});
 const cu=S.customers.find(x=>x.id==cust);
 const inv={id:'HD-'+pad(S.invoices.length+1).padStart(4,'0'),t:Date.now(),items,sub:c.sub,pd:c.pd,md:c.md,total:c.total,pts:cu?c.pts:0,cn:cu?cu.name:'Khách lẻ',pay};
 if(cu){cu.pts=(cu.pts||0)+c.pts;cu.spent=(cu.spent||0)+c.total}
 S.invoices.unshift(inv);save();
 cart={};disc={t:'p',v:0};promoId='';
 toast('Đã thanh toán '+money(inv.total)+(cu?' · +'+c.pts+' điểm':''));go('home');
}
function addP(){const n=$('#pn').value.trim();if(!n)return toast('Nhập tên hàng');S.products.push({id:uid(),name:n,price:+$('#pp').value||0});save();render()}
function addC(){const n=$('#cn').value.trim();if(!n)return toast('Nhập tên khách');S.customers.push({id:uid(),name:n,phone:$('#cp').value.trim(),note:'',pts:0,spent:0});save();render()}
function addPr(){const n=$('#rn').value.trim();if(!n||!(+$('#rv').value))return toast('Nhập tên và mức giảm');
 S.promos.push({id:uid(),name:n,t:$('#rt').value,v:+$('#rv').value,min:+$('#rm').value||0,end:$('#re').value,on:true});save();render()}
function addA(){
 const d=$('#ad').value,t=$('#at').value;if(!d||!t)return toast('Chọn ngày và giờ');
 S.appts.push({id:uid(),name:$('#an').value.trim(),d,tm:t,rm:+$('#ar').value,note:$('#ano').value.trim(),done:0,fired:0});
 try{if(window.Notification&&Notification.permission=='default')Notification.requestPermission()}catch(e){}
 save();render();
}
function tick(){
 const n=Date.now();
 S.appts.forEach(a=>{
  if(a.done||a.fired)return;
  const t=new Date(a.d+'T'+a.tm).getTime();
  if(n>=t-a.rm*60000){a.fired=1;save();if(n<t+6*3600000)alarm(a)}
 });
}
function alarm(a){
 const m=(a.name||'Khách')+' · '+a.tm+(a.note?' · '+a.note:'');
 const el=document.createElement('div');el.className='al';
 el.innerHTML='<span>Nhắc hẹn: '+esc(m)+'</span><button onclick="this.parentNode.remove()">Đóng</button>';
 $('#alert').appendChild(el);
 try{if(window.Notification&&Notification.permission=='granted')new Notification('Nhắc lịch hẹn',{body:m});if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}
setInterval(tick,15000);
const dt=a=>new Date(a.d+'T'+a.tm).getTime();
const fd=d=>d.split('-').reverse().join('/');
const V={
home(){
 const td=new Date().toDateString(),inv=S.invoices.filter(i=>new Date(i.t).toDateString()==td);
 const rev=inv.reduce((s,i)=>s+i.total,0),pts=inv.reduce((s,i)=>s+i.pts,0);
 const nx=S.appts.filter(a=>!a.done).sort((a,b)=>dt(a)-dt(b))[0];
 const pr=S.promos.filter(p=>p.on&&(!p.end||p.end>=today()));
 return `<div><div class="mut">Xin chào,</div><h1>Cửa hàng của bạn</h1></div>
 <div class="hero"><div style="font-size:13px">Doanh thu hôm nay</div><b>${money(rev)}</b><div style="font-size:13px">${inv.length} hoá đơn · ${S.customers.length} khách lưu · ${pts} điểm đã cộng</div></div>
 <button class="btn" onclick="go('sell')">Tạo hoá đơn mới</button>
 <div class="grid4">
 <button class="tile" onclick="go('prod')"><span style="color:var(--pri)">${ic('box',24)}</span>Hàng hoá</button>
 <button class="tile" onclick="go('cust')"><span style="color:var(--pri)">${ic('cust',24)}</span>Khách hàng</button>
 <button class="tile" onclick="go('cal')"><span style="color:var(--pri)">${ic('cal',24)}</span>Lịch hẹn</button>
 <button class="tile" onclick="go('promo')"><span style="color:var(--pri)">${ic('tag',24)}</span>Khuyến mãi</button></div>
 <h2>Lịch hẹn sắp tới</h2>
 ${nx?`<div class="card row"><div class="badge" style="padding:10px;font-size:15px">${esc(nx.tm)}<br><span style="font-weight:400;font-size:11px">${fd(nx.d)}</span></div><div class="grow"><b>${esc(nx.name||'Khách')}</b><div class="mut">${esc(nx.note)}</div>${nx.rm?`<div style="color:var(--amb);font-size:12px;font-weight:600">Nhắc trước ${nx.rm} phút</div>`:''}</div></div>`:'<div class="card mut">Chưa có lịch hẹn.</div>'}
 ${pr.map(p=>`<div class="promo"><div style="font-size:12px;font-weight:600">KHUYẾN MÃI ĐANG CHẠY</div><b>${esc(p.name)}</b><div style="font-size:12px">Giảm ${p.t=='p'?p.v+'%':money(p.v)}${p.min?' · từ '+money(p.min):''}${p.end?' · đến '+fd(p.end):''}</div></div>`).join('')}
 <h2>Hoá đơn gần đây</h2>
 <div class="card col">${S.invoices.slice(0,4).map(i=>`<div class="row sp"><div><b>${esc(i.cn)}</b><div class="mut">${i.id} · ${new Date(i.t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})} · ${esc(i.pay)}</div></div><div style="text-align:right"><b>${money(i.total)}</b><div class="badge">+${i.pts} điểm</div></div></div>`).join('')||'<span class="mut">Chưa có hoá đơn.</span>'}</div>`;
},
sell(){
 const c=calc(),cu=S.customers.find(x=>x.id==cust);
 const ids=Object.keys(cart).filter(id=>S.products.some(p=>p.id==id));
 const opts=S.promos.filter(p=>p.on&&(!p.end||p.end>=today()));
 return `<h1>Bán hàng</h1>
 ${S.products.length?`<div class="pg">${S.products.map(p=>`<button onclick="add('${p.id}')"><b>${esc(p.name)}</b><div class="mut">${money(p.price)}</div></button>`).join('')}</div>`:'<div class="card mut">Chưa có hàng hoá. Vào Trang chủ › Hàng hoá để thêm.</div>'}
 <div class="card col"><h2>Giỏ hàng</h2>
 ${ids.map(id=>{const p=S.products.find(x=>x.id==id);return `<div class="row"><div class="grow"><b>${esc(p.name)}</b><div class="mut">${money(p.price)} × ${cart[id]}</div></div><button class="sm" aria-label="Giảm" onclick="qty('${id}',-1)">−</button><b>${cart[id]}</b><button class="sm" aria-label="Tăng" onclick="qty('${id}',1)">+</button></div>`}).join('')||'<span class="mut">Chưa có sản phẩm.</span>'}</div>
 <div class="card col">
 <label for="sc">Khách hàng</label><select id="sc" onchange="cust=this.value;render()"><option value="">Khách lẻ (không tích điểm)</option>${S.customers.map(x=>`<option value="${x.id}" ${x.id==cust?'selected':''}>${esc(x.name)} · ${x.pts||0} điểm</option>`).join('')}</select>
 <label for="sp">Khuyến mãi</label><select id="sp" onchange="promoId=this.value;render()"><option value="">Không áp dụng</option>${opts.map(p=>`<option value="${p.id}" ${p.id==promoId?'selected':''}>${esc(p.name)}${okPromo(p,c.sub)?'':' (chưa đủ điều kiện)'}</option>`).join('')}</select>
 <label for="dv">Giảm giá thêm</label><div class="row"><input id="dv" type="number" min="0" inputmode="numeric" value="${disc.v||''}" placeholder="0" onchange="disc.v=+this.value||0;render()"><select aria-label="Loại giảm giá" style="width:90px" onchange="disc.t=this.value;render()"><option value="p" ${disc.t=='p'?'selected':''}>%</option><option value="d" ${disc.t=='d'?'selected':''}>₫</option></select></div>
 <label for="pm">Thanh toán</label><select id="pm" onchange="pay=this.value">${['Tiền mặt','Chuyển khoản','Thẻ'].map(x=>`<option ${x==pay?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="card tot"><div><span>Tạm tính</span><span>${money(c.sub)}</span></div><div><span>Khuyến mãi</span><span>−${money(c.pd)}</span></div><div><span>Giảm thêm</span><span>−${money(c.md)}</span></div><div class="big"><span>Tổng</span><span>${money(c.total)}</span></div><div class="mut"><span>${cu?'Điểm cộng cho '+esc(cu.name):'Chọn khách để tích điểm'}</span><span>${cu?'+'+c.pts:''}</span></div></div>
 <button class="btn pri" onclick="checkout()">Thanh toán</button>`;
},
prod(){
 return `<div class="row"><button class="sm" aria-label="Quay lại" onclick="go('home')">‹</button><h1>Hàng hoá</h1></div>
 <div class="card col"><input id="pn" placeholder="Tên hàng" aria-label="Tên hàng"><input id="pp" type="number" min="0" inputmode="numeric" placeholder="Giá (₫)" aria-label="Giá"><button class="btn pri" onclick="addP()">Thêm hàng</button></div>
 ${S.products.map(p=>`<div class="card col"><input aria-label="Tên hàng" value="${esc(p.name)}" onchange="set('products','${p.id}','name',this.value)"><div class="row"><input aria-label="Giá" type="number" min="0" inputmode="numeric" value="${p.price}" onchange="set('products','${p.id}','price',this.value,1)"><button class="danger" onclick="del('products','${p.id}')">Xoá</button></div></div>`).join('')}`;
},
promo(){
 return `<div class="row"><button class="sm" aria-label="Quay lại" onclick="go('home')">‹</button><h1>Khuyến mãi &amp; điểm</h1></div>
 <div class="card col"><h2>Quy tắc tích điểm</h2>
 <label for="s1">Điểm = bao nhiêu % giá trị hoá đơn</label><input id="s1" type="number" min="0" value="${S.set.rate}" onchange="setS('rate',this.value)">
 <label for="s2">1 điểm có giá trị (₫)</label><input id="s2" type="number" min="1" value="${S.set.unit}" onchange="setS('unit',this.value)">
 <span class="mut">Ví dụ: hoá đơn 620.000 ₫ × ${S.set.rate}% ÷ ${S.set.unit.toLocaleString('vi-VN')} = ${Math.floor(620000*S.set.rate/100/(S.set.unit||1))} điểm.</span></div>
 <div class="card col"><h2>Thêm chương trình</h2><input id="rn" placeholder="Tên chương trình" aria-label="Tên chương trình">
 <div class="row"><input id="rv" type="number" min="0" placeholder="Mức giảm" aria-label="Mức giảm"><select id="rt" aria-label="Loại" style="width:90px"><option value="p">%</option><option value="d">₫</option></select></div>
 <input id="rm" type="number" min="0" placeholder="Hoá đơn tối thiểu (₫)" aria-label="Hoá đơn tối thiểu"><label for="re">Ngày kết thúc (tuỳ chọn)</label><input id="re" type="date"><button class="btn pri" onclick="addPr()">Thêm khuyến mãi</button></div>
 ${S.promos.map(p=>`<div class="promo row sp"><div class="grow"><b>${esc(p.name)}</b><div style="font-size:12px">Giảm ${p.t=='p'?p.v+'%':money(p.v)}${p.min?' · từ '+money(p.min):''}${p.end?' · đến '+fd(p.end):''}</div></div><button onclick="set('promos','${p.id}','on',${p.on?0:1},1);render()">${p.on?'Đang bật':'Đã tắt'}</button><button class="danger" onclick="del('promos','${p.id}')">Xoá</button></div>`).join('')}`;
},
cal(){
 const l=[...S.appts].sort((a,b)=>(a.done-b.done)||(dt(a)-dt(b)));
 return `<h1>Lịch hẹn</h1>
 <div class="card col"><input id="an" list="cl" placeholder="Tên khách" aria-label="Tên khách"><datalist id="cl">${S.customers.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
 <div class="row"><input id="ad" type="date" value="${today()}" aria-label="Ngày"><input id="at" type="time" aria-label="Giờ"></div>
 <select id="ar" aria-label="Nhắc trước"><option value="0">Nhắc đúng giờ</option><option value="15" selected>Nhắc trước 15 phút</option><option value="30">Nhắc trước 30 phút</option><option value="60">Nhắc trước 1 giờ</option></select>
 <input id="ano" placeholder="Ghi chú về khách" aria-label="Ghi chú"><button class="btn pri" onclick="addA()">Thêm lịch hẹn</button></div>
 ${l.map(a=>`<div class="card row ${a.done?'done':''}"><div class="badge" style="padding:8px">${esc(a.tm)}<br><span style="font-weight:400;font-size:11px">${fd(a.d)}</span></div><div class="grow"><b>${esc(a.name||'Khách')}</b><div class="mut">${esc(a.note)}</div></div><button onclick="set('appts','${a.id}','done',${a.done?0:1},1);render()">${a.done?'Mở lại':'Xong'}</button><button class="danger sm" aria-label="Xoá" onclick="del('appts','${a.id}')">✕</button></div>`).join('')||'<div class="card mut">Chưa có lịch hẹn.</div>'}`;
},
cust(){
 return `<h1>Khách hàng</h1>
 <div class="card col"><input id="cn" placeholder="Tên khách" aria-label="Tên khách"><input id="cp" type="tel" placeholder="Số điện thoại" aria-label="Số điện thoại"><button class="btn pri" onclick="addC()">Lưu khách hàng</button></div>
